name: Build dashboard and deploy to Pages

# Rebuilds index.html from data/raw on every push, so the published page can never
# drift from the data in the repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the pipeline
        run: python src/build_glofdb.py

      - name: Fail if the committed dashboard is stale
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::warning::index.html in the repository differs from a fresh build."
            echo "The deployed page uses the fresh build. Commit it to keep them in step:"
            echo "  python src/build_glofdb.py && git add index.html data/processed && git commit"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
